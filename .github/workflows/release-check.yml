name: Release Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: niral_test
          POSTGRES_PASSWORD: niral_test
          POSTGRES_DB: niral_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U niral_test -d niral_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install isolated test tools
        run: |
          npm install --prefix tests/browser --no-package-lock --ignore-scripts
          npm exec --prefix tests/browser -- playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/niral-tools" --no-package-lock --ignore-scripts typescript@5.7.3
          sudo apt-get update
          sudo apt-get install -y webp
      - name: Validate release
        run: npm run test:release
        env:
          NIRAL_TSC: ${{ runner.temp }}/niral-tools/node_modules/typescript/lib/typescript.js
          NIRAL_RELEASE_EXTENDED: "1"
          NIRAL_CWEBP: /usr/bin/cwebp
          NIRAL_TEST_PG_URL: postgres://niral_test:niral_test@127.0.0.1:5432/niral_test

  validate-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install isolated test tools
        shell: bash
        run: |
          npm install --prefix tests/browser --no-package-lock --ignore-scripts
          npm exec --prefix tests/browser -- playwright install chromium
          npm install --prefix "$RUNNER_TEMP/niral-tools" --no-package-lock --ignore-scripts typescript@5.7.3
      - name: Validate release
        run: npm run test:release
        env:
          NIRAL_TSC: ${{ runner.temp }}/niral-tools/node_modules/typescript/lib/typescript.js