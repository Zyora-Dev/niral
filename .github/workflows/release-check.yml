name: Release Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-languages:
    name: Language comparison (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install isolated pinned TypeScript
        run: npm install --prefix "$RUNNER_TEMP/niral-tools" --no-package-lock --ignore-scripts typescript@5.7.3
      - name: Compare JavaScript, TypeScript and NiralScript
        shell: bash
        env:
          NIRAL_TSC: ${{ runner.temp }}/niral-tools/node_modules/typescript/lib/typescript.js
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          printf 'Commit: %s\nRunner: %s/%s\n' "$GITHUB_SHA" "$RUNNER_OS" "$RUNNER_ARCH" > benchmark-results/environment.txt
          node --input-type=module -e 'import os from "node:os"; console.log(JSON.stringify({ node: process.version, v8: process.versions.v8, platform: os.platform(), release: os.release(), arch: os.arch(), cpu: os.cpus()[0]?.model, logicalCpus: os.cpus().length, memoryBytes: os.totalmem() }, null, 2))' >> benchmark-results/environment.txt
          for repeat in 1 2 3; do
            node bench/niralscript.js language 2>&1 | tee "benchmark-results/language-$repeat.log"
          done
      - name: Upload comparison results
        if: always()
        id: comparison-artifact
        uses: actions/upload-artifact@v4
        with:
          name: language-comparison-node-${{ matrix.node }}-${{ github.run_attempt }}
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 30
      - name: Summarize comparison
        if: always()
        shell: bash
        env:
          NODE_MAJOR: ${{ matrix.node }}
          RESULTS_URL: ${{ steps.comparison-artifact.outputs.artifact-url }}
        run: |
          printf '## JavaScript vs TypeScript vs NiralScript (Node %s)\n\n' "$NODE_MAJOR" >> "$GITHUB_STEP_SUMMARY"
          printf 'Commit: `%s`\n\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'Three sequential processes, each using 30 warmup calls and 12 rotated rounds. Identical numeric, record, string and async function bodies; correctness assertions and strict TS checks precede timing.\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Inspect the job status and logs for completed repetitions. Hosted-runner timings are noisy; no speed thresholds or universal language ranking. Compilation and execution are separate measurements.\n\n' >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$RESULTS_URL" ]]; then
            printf '[Download raw measurements and runner metadata](%s)\n' "$RESULTS_URL" >> "$GITHUB_STEP_SUMMARY"
          fi

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: niral_test
          POSTGRES_PASSWORD: niral_test
          POSTGRES_DB: niral_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U niral_test -d niral_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install isolated test tools
        run: |
          npm install --prefix tests/browser --no-package-lock --ignore-scripts
          npm exec --prefix tests/browser -- playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/niral-tools" --no-package-lock --ignore-scripts typescript@5.7.3
          sudo apt-get update
          sudo apt-get install -y webp
      - name: Validate release
        run: npm run test:release
        env:
          NIRAL_TSC: ${{ runner.temp }}/niral-tools/node_modules/typescript/lib/typescript.js
          NIRAL_RELEASE_EXTENDED: "1"
          NIRAL_CWEBP: /usr/bin/cwebp
          NIRAL_TEST_PG_URL: postgres://niral_test:niral_test@127.0.0.1:5432/niral_test

  validate-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Python worker interpreter
        run: python3 -c "import sys; print(sys.executable); print(sys.version)"
      - name: Install isolated test tools
        shell: bash
        run: |
          npm install --prefix tests/browser --no-package-lock --ignore-scripts
          npm exec --prefix tests/browser -- playwright install chromium
          npm install --prefix "$RUNNER_TEMP/niral-tools" --no-package-lock --ignore-scripts typescript@5.7.3
      - name: Validate release
        run: npm run test:release
        env:
          NIRAL_TSC: ${{ runner.temp }}/niral-tools/node_modules/typescript/lib/typescript.js