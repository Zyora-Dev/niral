<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Niral · Counter + Todos</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; background: #0a0a0a; color: #eee; max-width: 560px; margin: 3rem auto; padding: 0 1rem; }
    h1 { color: #34d399; }
    .sub { color: #888; }
    section { border: 1px solid #262626; border-radius: 14px; padding: 1.2rem 1.4rem; margin: 1.2rem 0; }
    button { background: #34d399; color: #000; border: 0; border-radius: 9px; padding: .55rem 1.1rem; font-weight: 700; cursor: pointer; }
    input[type="text"], input:not([type]) { background: #161616; border: 1px solid #333; color: #eee; border-radius: 9px; padding: .55rem .8rem; }
    .big { color: #fbbf24; font-weight: 700; }
    .todo { display: flex; gap: .5rem; align-items: center; padding: .3rem 0; }
    .done { text-decoration: line-through; color: #777; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import App from "./app.niral";
    App(document.getElementById("app"));
  </script>
</body>
</html>
